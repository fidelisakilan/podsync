[project]
name = "ipod-sync"
version = "1.0.0"
description = "One-way sync of your Apple Music library to an iPod Classic"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gamdl>=2.9.3",
    "click>=8.0",
    "rich>=13.0",
    "cffi>=2.0.0",
    "mutagen>=1.47.0",
    "playwright>=1.40",
    "setuptools>=82.0.1",
]

[project.scripts]
ipod-sync = "ipod_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipod_sync"]
